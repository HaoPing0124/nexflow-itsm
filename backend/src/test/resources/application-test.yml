# 测试用：内存 H2，避免污染本地 ./data 开发库
spring:
  datasource:
    url: jdbc:h2:mem:nexflow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  seed-demo-data: true
  jwt:
    secret: nexflow-test-secret-0123456789abcdef0123456789abcdef
    expiration-ms: 3600000
