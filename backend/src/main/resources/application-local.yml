# Local development: H2 file DB in MySQL compatibility mode.
# Data persists across restarts in ./data/nexflow; add ./data to .gitignore.
spring:
  datasource:
    url: jdbc:h2:file:./data/nexflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update

app:
  seed-demo-data: true
  # 本地开发放开端口通配：Vite 端口被占用会自动顺延，写死端口会导致登录 403 Invalid CORS request
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*
