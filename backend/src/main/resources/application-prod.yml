# Production profile: MySQL 8 (docker-compose default).
spring:
  datasource:
    url: ${NEXFLOW_DB_URL:jdbc:mysql://localhost:3306/nexflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${NEXFLOW_DB_USER:nexflow}
    password: ${NEXFLOW_DB_PASSWORD:nexflow_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  seed-demo-data: true
