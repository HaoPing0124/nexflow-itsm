services:
  mysql:
    image: mysql:8.0
    container_name: nexflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexflow_root}
      MYSQL_DATABASE: nexflow
      MYSQL_USER: nexflow
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:-nexflow_secret}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnexflow_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexflow-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NEXFLOW_DB_URL: jdbc:mysql://mysql:3306/nexflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      NEXFLOW_DB_USER: nexflow
      NEXFLOW_DB_PASSWORD: nexflow_secret
      NEXFLOW_JWT_SECRET: ${NEXFLOW_JWT_SECRET:-change-me-in-prod-please-0123456789abcdef}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
